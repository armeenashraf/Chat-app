<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Petalk 🌷</title>
<style>
:root{--p:#ff8fb8;--p2:#ffd6e7;--l:#c9b6ff;--bg:#fff5fa;--ink:#4a3350;--me:#ffd1e3;--card:#fff;--sh:0 8px 30px #ff8fb840}
*{box-sizing:border-box;margin:0;font-family:'Nunito','Segoe UI',system-ui,sans-serif}
body{background:linear-gradient(135deg,#ffe3f0,#e6dcff);color:var(--ink);min-height:100vh}
button{cursor:pointer;border:0}input{outline:0}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:32px;width:100%;max-width:400px;text-align:center}
.mascot{font-size:64px;animation:b 2s infinite}@keyframes b{50%{transform:translateY(-8px)}}
.card h1{margin:6px 0;color:#e0508a}.card p{opacity:.7;margin-bottom:18px}
.card input{width:100%;padding:13px 16px;margin:6px 0;border:2px solid var(--p2);border-radius:16px;font-size:15px;background:#fffafd}
.card input:focus{border-color:var(--p)}
.btn{width:100%;padding:13px;margin-top:10px;border-radius:16px;background:linear-gradient(90deg,var(--p),var(--l));color:#fff;font-weight:800;font-size:16px}
.link{background:none;color:#e0508a;margin-top:14px;font-weight:700}
.err{color:#d6336c;font-size:13px;min-height:18px;margin-top:6px}
/* app */
.app{display:flex;height:100vh;max-width:1200px;margin:auto;background:#fff;box-shadow:var(--sh)}
.side{width:340px;border-right:2px solid var(--p2);display:flex;flex-direction:column;background:var(--bg)}
.top{padding:14px;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--p2),#e6dcff)}
.top b{flex:1;font-size:18px}.ib{background:#fff;border-radius:50%;width:36px;height:36px;font-size:17px}
.search{margin:10px 12px;padding:10px 14px;border-radius:14px;border:2px solid var(--p2);background:#fff}
.list{overflow:auto;flex:1}
.ct{display:flex;gap:12px;padding:12px 14px;align-items:center;cursor:pointer}
.ct:hover,.ct.on{background:var(--p2)}
.av{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 2px 8px #ff8fb855;flex:none}
.ct .m{flex:1;min-width:0}.ct .n{font-weight:800}.ct .s{font-size:13px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct small{font-size:11px;opacity:.6}.bd{background:var(--p);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;display:block;margin-top:3px}
.main{flex:1;display:flex;flex-direction:column;background:#fff0f7 radial-gradient(#ffd6e7 1.5px,transparent 1.5px) 0 0/22px 22px}
.hd{padding:12px 16px;display:flex;gap:12px;align-items:center;background:#fff;border-bottom:2px solid var(--p2)}
.hd .t{font-weight:800}.hd .st{font-size:12px;color:#9b6bd1}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.b{max-width:70%;padding:9px 13px;border-radius:18px;background:#fff;box-shadow:0 2px 6px #0001;white-space:pre-wrap;word-break:break-word;animation:pop .2s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.b.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}.b.them{align-self:flex-start;border-bottom-left-radius:4px}
.b i{display:block;font-size:10px;opacity:.55;text-align:right;font-style:normal;margin-top:2px}
.bar{display:flex;gap:8px;padding:12px;background:#fff;border-top:2px solid var(--p2)}
.bar input{flex:1;padding:12px 16px;border-radius:22px;border:2px solid var(--p2)}
.send{width:46px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--l));color:#fff;font-size:18px}
.empty{margin:auto;text-align:center;opacity:.7;font-size:18px}
.modal{position:fixed;inset:0;background:#4a335080;display:none;place-items:center;z-index:9}.modal.on{display:grid}
.pick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}.pick span{font-size:26px;cursor:pointer;padding:4px;border-radius:12px}.pick .sel{background:var(--p2)}
.back{display:none}
@media(max-width:700px){.side{width:100%}.main{display:none}.app.chat .side{display:none}.app.chat .main{display:flex}.back{display:block}}

.card{max-height:92vh;overflow:auto}.av{overflow:hidden}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;text-align:left}.row>b{width:84px;font-size:12px;flex:none}
.sw{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 1px #d9c3d3;margin:3px;cursor:pointer;font-size:12px;background:#fff}.sw.sel{box-shadow:0 0 0 3px var(--p)}
.chip{display:inline-block;padding:5px 10px;margin:3px;border-radius:14px;background:var(--bg);border:2px solid var(--p2);cursor:pointer;font-size:13px}.chip.sel{background:var(--p2);border-color:var(--p)}
.pfav{width:110px;height:110px;margin:0 auto 8px;border-radius:50%;overflow:hidden;box-shadow:var(--sh)}
.irow{padding:10px;margin:6px 0;border-radius:14px;background:var(--bg);text-align:left}.irow small{display:block;opacity:.6}
body.dark{--bg:#2a2133;--ink:#f3e8ff;--card:#3a2d47;--p2:#4d3a5e;--me:#6b3f66}
body.dark .app,body.dark .hd,body.dark .bar,body.dark .b.them,body.dark input:not([type=checkbox]),body.dark .search,body.dark .sw,body.dark .ib{background:#3a2d47;color:#f3e8ff}
body.dark .main{background:#2a2133}body.dark .card{background:#3a2d47}body.dark .top{background:linear-gradient(90deg,#4d3a5e,#3a2d47)}
.main{position:relative}.app{height:100vh;height:100dvh}.msgs{overscroll-behavior:contain}
.sys{align-self:center;background:#fff9;padding:4px 12px;border-radius:12px;font-size:12px;opacity:.85}
.pic{display:block;max-width:100%;width:240px;border-radius:12px;margin-bottom:4px;cursor:zoom-in}
.b strong{display:block;font-size:12px}.del{display:none;font-size:11px;color:#d6336c;cursor:pointer;margin-top:4px}.b.act .del{display:block}
.emopanel{display:none;position:absolute;bottom:72px;left:10px;right:10px;max-width:340px;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:8px;flex-wrap:wrap;gap:2px;z-index:5}.emopanel.on{display:flex}
.emopanel span{font-size:24px;padding:4px;cursor:pointer;border-radius:10px}.emopanel span:hover{background:var(--p2)}
@media(max-width:700px){.b{max-width:84%}.pic{width:200px}.card{padding:22px;border-radius:22px}.app{box-shadow:none}.bar{padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}.top{padding-top:max(14px,env(safe-area-inset-top))}}
@media(min-width:701px) and (max-width:950px){.side{width:280px}}
body.dark .emopanel{background:#3a2d47}
html,body{height:100%}.app{height:100dvh}
.tabs{display:flex;border-top:2px solid var(--p2);background:#fff}.tabs button{flex:1;padding:8px 0;background:none;font-size:20px;color:var(--ink);opacity:.55}.tabs small{display:block;font-size:11px}.tabs .on{opacity:1;color:#e0508a}
.ring{box-shadow:0 0 0 3px var(--p)}.ring.seen{box-shadow:0 0 0 3px #ccc}.sec{padding:8px 14px;font-size:12px;opacity:.6;font-weight:800}
.b{position:relative}.rx{position:absolute;bottom:-12px;right:8px;background:#fff;border-radius:12px;padding:0 5px;box-shadow:0 1px 4px #0003;font-size:13px;color:#333}.b:has(.rx){margin-bottom:12px}
#rx{position:fixed;z-index:30;display:none;gap:6px;background:#fff;padding:6px 12px;border-radius:24px;box-shadow:0 4px 18px #0003}#rx span{font-size:24px;cursor:pointer}
#call,#story{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff}
#call{background:linear-gradient(160deg,#c9b6ff,#ff8fb8)}#call.vid{background:linear-gradient(160deg,#4b3a6b,#e0508a,#6aa7ff);background-size:300% 300%;animation:gr 8s ease infinite}@keyframes gr{50%{background-position:100% 100%}}
.cav{width:130px;height:130px;font-size:72px;border-radius:50%;background:#fff3;display:grid;place-items:center;animation:pl 1.6s infinite}@keyframes pl{50%{box-shadow:0 0 0 24px #fff2}}
.cbtns{display:flex;gap:18px;margin-top:40px}.cbtns button{width:60px;height:60px;border-radius:50%;font-size:24px;background:#fff4;color:#fff}.cbtns .off{background:#fff;color:#333}
#cme{position:absolute;right:16px;bottom:120px;width:90px;height:120px;border-radius:16px;overflow:hidden;border:3px solid #fff;display:none}
#stbars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px}#stbars span{flex:1;height:3px;background:#fff5;border-radius:3px;overflow:hidden}#stbars b{display:block;height:100%;width:0;background:#fff}@keyframes fill{to{width:100%}}
#sthead{position:absolute;top:24px;left:14px;display:flex;gap:10px;align-items:center;color:#fff}#sthead .av{width:38px;height:38px;font-size:20px;color:#333}
#stx{position:absolute;top:20px;right:14px;z-index:2;background:#0004;color:#fff;border-radius:50%;width:36px;height:36px}
#sttext{font-size:28px;font-weight:800;text-align:center;padding:30px;text-shadow:0 2px 8px #0003}#stprev,#stnext{position:absolute;top:70px;bottom:0;width:40%}#stprev{left:0}#stnext{right:0}
body.dark .tabs{background:#3a2d47}@media(max-width:700px){.b{max-width:84%}}
</style></head>
<body>
<!-- SIGN IN / SIGN UP -->
<div class="auth" id="authView" style="display:none"><div class="card">
<div class="mascot"><svg viewBox="0 0 64 64" width="76" height="76"><path d="M10 14Q10 6 18 6H46Q54 6 54 14V36Q54 44 46 44H30L18 57V44Q10 44 10 36Z" fill="#ff8fb8"/><g transform="translate(32 25)" fill="#fff"><ellipse cy="-9" rx="4.5" ry="7"/><ellipse cy="-9" rx="4.5" ry="7" transform="rotate(72)"/><ellipse cy="-9" rx="4.5" ry="7" transform="rotate(144)"/><ellipse cy="-9" rx="4.5" ry="7" transform="rotate(216)"/><ellipse cy="-9" rx="4.5" ry="7" transform="rotate(288)"/></g><circle cx="32" cy="25" r="4.5" fill="#ffd166"/></svg></div><h1>Petalk</h1><p id="sub">Welcome back! Sign in to chat 💕</p>
<input id="name" placeholder="Your cute name" style="display:none">
<input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (6+ chars)">
<div class="err" id="err"></div>
<button class="btn" id="go">Sign In</button>
<button class="link" id="tg">New here? Create account</button>
</div></div>

<!-- CHAT APP -->
<div class="app" id="app" style="display:none">
<div class="side"><div class="top"><div class="av" id="myav" style="width:46px;height:46px;cursor:pointer"></div><div id="mybox" style="flex:1;min-width:0;cursor:pointer"><b id="me" style="font-size:17px">Cutie</b><div class="s" id="mymood" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div>
<button class="ib" id="add" title="Add contact">➕</button><button class="ib" id="grp" title="New group">👥</button><button class="ib" id="out" title="Sign out">🚪</button></div>
<input class="search" id="q" placeholder="Search chats 🔍"><div class="list" id="list"></div><div class="tabs" id="tabs"><button class="on" data-t="chats">💬<small>Chats</small></button><button data-t="status">🌈<small>Status</small></button><button data-t="calls">📞<small>Calls</small></button></div></div>
<div class="main" id="main"></div></div>

<!-- ADD CONTACT -->
<div class="modal" id="modal"><div class="card"><h1>Add Contact 💌</h1><p>Pick an avatar</p><div class="pick" id="pick"></div>
<input id="cn" placeholder="Name"><input id="cs" placeholder="Status (optional)"><input id="cp" type="tel" placeholder="Phone number (optional)">
<button class="btn" id="save">Add</button><button class="link" id="cancel">Cancel</button></div></div>

<!-- GROUP -->
<div class="modal" id="gm"><div class="card"><h1>New Group 👥</h1><p style="margin-bottom:4px">Pick an icon</p><div class="pick" id="gpick"></div>
<input id="gn" placeholder="Group name"><p style="margin:10px 0 4px;text-align:left">Add members (2+)</p><div id="gmem" style="text-align:left"></div>
<button class="btn" id="gsave">Create Group</button><button class="link" id="gx">Cancel</button></div></div>
<div class="modal" id="lb" onclick="this.classList.remove('on')"><img id="lbi" style="max-width:94vw;max-height:90vh;border-radius:16px"></div>
<div class="modal" id="stm"><div class="card"><h1>New Status 🌈</h1><input id="stt" placeholder="What's on your mind?"><div class="pick" id="stc"></div><button class="btn" id="stp">Post</button><button class="link" id="stq">Cancel</button></div></div>
<div id="rx"></div>
<div id="call"><div id="cme"></div><div class="cav" id="cav"></div><h2 id="cname"></h2><p id="cst"></p><div class="cbtns"><button id="cmute">🎤</button><button id="cspk">🔊</button><button id="cend" style="background:#ff4d6d">📵</button></div></div>
<div id="story"><div id="stbars"></div><div id="sthead"></div><div id="sttext"></div><div id="stprev"></div><div id="stnext"></div><button id="stx">✕</button></div>
<!-- PROFILE -->
<div class="modal" id="pf"><div class="card" style="max-width:460px"><h1 id="pft">My Profile 🌷</h1><div class="pfav" id="pfav"></div>
<div><label class="btn" style="display:inline-block;width:auto;padding:8px 14px;font-size:13px">📷 Upload photo<input type="file" id="pph" accept="image/*" hidden></label>
<button class="link" id="pphx" style="margin:0 8px">Use bitmoji</button><button class="link" id="rnd" style="margin:0">🎲 Random</button></div>
<div id="pfopts" style="margin-top:8px"></div>
<input id="pn" placeholder="Name"><input id="pu" placeholder="Username (e.g. petal_girl)"><input id="pb" placeholder="About">
<div id="pfabout"></div><input id="pp" type="tel" placeholder="Phone number">
<p style="margin:8px 0 0;font-size:12px;text-align:left">🎂 Birthday</p><input id="pbd" type="date">
<p style="margin:10px 0 2px">My mood</p><div id="pfmood"></div><p style="margin:10px 0 2px">Theme color</p><div id="pfacc"></div>
<label class="irow" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pls" style="width:auto;margin:0"> Show my last seen</label>
<label class="irow" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="prr" style="width:auto;margin:0"> Read receipts (blue ticks)</label>
<label class="irow" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pdk" style="width:auto;margin:0"> Dark mode 🌙</label>
<button class="btn" id="pfsave">Save Profile</button><button class="link" id="pfx">Skip for now</button></div></div>
<!-- CONTACT INFO -->
<div class="modal" id="inf"><div class="card"><div id="ifbody"></div><button class="btn" id="ifx">Close</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDspCs9sX9LzJc8QJ5uMtOnofcmV82kvGI",
  authDomain: "chatgpt-9efba.firebaseapp.com",
  databaseURL: "https://chatgpt-9efba-default-rtdb.firebaseio.com",
  projectId: "chatgpt-9efba",
  storageBucket: "chatgpt-9efba.firebasestorage.app",
  messagingSenderId: "1023461909276",
  appId: "1:1023461909276:web:76d193a9c5fa21899c10d9",
  measurementId: "G-YQEN7BPJ0Q"
};
const auth = getAuth(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);

/* ---------- AUTH ---------- */
let signup = false;
$("tg").onclick = () => {
  signup = !signup;
  $("name").style.display = signup ? "block" : "none";
  $("go").textContent = signup ? "Sign Up" : "Sign In";
  $("tg").textContent = signup ? "Already have an account? Sign in" : "New here? Create account";
  $("sub").textContent = signup ? "Join the cutest chat ever 🌸" : "Welcome back! Sign in to chat 💕";
  $("err").textContent = "";
};
$("go").onclick = async () => {
  const e = $("email").value.trim(), p = $("pass").value;
  $("err").textContent = "";
  try {
    if (signup) {
      const n = $("name").value.trim();
      if (!n) return $("err").textContent = "Please enter your name 🎀";
      const c = await createUserWithEmailAndPassword(auth, e, p);
      await updateProfile(c.user, { displayName: n });
    } else await signInWithEmailAndPassword(auth, e, p);
  } catch (x) {
    const m = { "auth/invalid-credential": "Wrong email or password", "auth/email-already-in-use": "Email already registered",
      "auth/weak-password": "Password needs 6+ characters", "auth/invalid-email": "Invalid email",
      "auth/operation-not-allowed": "Enable Email/Password in Firebase Console → Authentication" };
    $("err").textContent = m[x.code] || x.message;
  }
};

/* ---------- CHAT ---------- */
const EM = ["🐱","🐻","🦊","🐼","🐨","🦄","🐸","🐥","🌸","🍓"];
const REPLIES = ["Haha yes! 😂","Omg really?? 😳","Aww that's so sweet 🥹","Tell me more!","I was just thinking about you 💕","Okayyy 👌","Lol same","No way!! 🙈","Let's meet up soon 🧋","Hehe 🌸","You're the best 💖"];
const GREET = ["Heyyy! 💕","Hii cutie! 🎀","Hello hello 🌷"];
let uid, S, cur = null, sel = EM[0];
const now = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const save = () => { try { localStorage.setItem("cc_" + uid, JSON.stringify(S)); } catch { alert("Storage full 🗑 — delete some photos"); } };
const seed = () => ({ contacts: [
  { id: "ai", name: "Petal AI ✨", em: "🤖", mood: "🤖 Always online", phone: "—", st: "Your cute assistant", ai: 1, unread: 1, msgs: [{ f: "them", t: "Hi! I'm Petal AI ✨ Ask me for a joke, the time, math (2+2), advice, or just chat!", ts: now() }] },
  { id: "d1", name: "Mimi", em: "🐱", mood: "🥰 In love", phone: "+92 300 1112233", st: "Living my best life 🌈", msgs: [{ f: "them", t: "Heyy! Did you see the new café? 🧋", ts: now() }], unread: 1 },
  { id: "d2", name: "Zara", em: "🦄", mood: "🤩 Excited", phone: "+92 321 4445566", st: "Busy ✨", msgs: [], unread: 0 },
  { id: "d3", name: "Hamza", em: "🐻", mood: "💪 Focused", phone: "+92 333 7778899", st: "At the gym 💪", msgs: [{ f: "them", t: "Bro are we still on for tonight?", ts: now() }], unread: 1 }] });

function ai(t) {
  t = t.toLowerCase();
  if (/^(hi|hello|hey)/.test(t)) return "Hello cutie! 🎀 How can I help today?";
  if (t.includes("joke")) return ["Why did the cookie go to the doctor? It felt crumby 🍪","What do you call a sleepy bunny? A hop-less napper 🐰"][Math.random() * 2 | 0];
  if (t.includes("time")) return "It's " + now() + " ⏰";
  if (t.includes("date") || t.includes("day")) return "Today is " + new Date().toDateString() + " 📅";
  if (t.includes("name")) return "I'm Petal AI, your pocket bestie 💖";
  if (/sad|tired|bad/.test(t)) return "Aww, sending you a big hug 🤗 Drink some water and take a little break. You've got this!";
  if (/thank/.test(t)) return "Anytime! 🌸";
  const m = t.match(/^[\d\s+\-*/().]+$/);
  if (m) { try { return "= " + Function('"use strict";return (' + t + ')')() + " 🧮"; } catch {} }
  return ["Ooh interesting! Tell me more 🌸","I think you should go for it! ✨","That sounds fun 💕 What happens next?"][Math.random() * 3 | 0];
}
function renderList() {
  $("q").style.display = tab === "chats" ? "" : "none";
  if (tab === "status") return renderStatus();
  if (tab === "calls") return renderCalls();
  const q = $("q").value.toLowerCase();
  $("list").innerHTML = S.contacts.filter(c => c.name.toLowerCase().includes(q)).map(c => {
    const l = c.msgs[c.msgs.length - 1];
    return `<div class="ct ${cur === c.id ? "on" : ""}" data-id="${c.id}"><div class="av">${c.em}</div><div class="m"><div class="n">${esc(c.name)}</div><div class="s">${l ? (l.img ? "📷 Photo" : esc(l.t)) : esc(c.st)}</div></div><div><small>${l ? l.ts : ""}</small>${c.unread ? `<span class="bd">${c.unread}</span>` : ""}</div></div>`;
  }).join("");
  document.querySelectorAll(".ct").forEach(e => e.onclick = () => open(e.dataset.id));
}
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function open(id) {
  cur = id; const c = S.contacts.find(x => x.id === id); c.unread = 0; save();
  $("app").classList.add("chat");

$("gpick").onclick = e => { if (e.target.dataset.e) { gsel = e.target.dataset.e; [...$("gpick").children].forEach(s => s.classList.toggle("sel", s.dataset.e === gsel)); } };
$("gx").onclick = () => $("gm").classList.remove("on");
$("gsave").onclick = () => {
  const n = $("gn").value.trim(), ids = [...$("gmem").querySelectorAll("input:checked")].map(i => i.value);
  if (!n) return alert("Give your group a name 🎀"); if (ids.length < 2) return alert("Pick at least 2 members 👥");
  const names = ids.map(i => S.contacts.find(c => c.id === i).name);
  S.contacts.unshift({ id: "g" + Date.now(), name: n, em: gsel, group: true, members: ids, st: "You, " + names.join(", "), unread: 0, msgs: [{ sys: 1, t: "You created group “" + n + "” 🎉", ts: now() }] });
  save(); $("gn").value = ""; $("gm").classList.remove("on"); renderList(); open(S.contacts[0].id);
};

onAuthStateChanged(auth, u => {
  $("authView").style.display = u ? "none" : "grid";
  $("app").style.display = u ? "flex" : "none";
  if (!u) { cur = null; $("app").classList.remove("chat"); return; }
  uid = u.uid;
  S = JSON.parse(localStorage.getItem("cc_" + uid) || "null") || seed();
  S.profile ||= { name: u.displayName || "Cutie", bio: "Hey there! I'm using Petalk 🌸", mood: "😊 Happy", phone: "", ls: true, rr: true, user: "", bday: "", photo: "", acc: 0, dark: false, av: { skin: 1, style: 0, hair: 0, eyes: 1, mouth: 0, acc: 2, bg: 0, shirt: 0 } };
  S.calls ||= DEMO_CALLS; S.my ||= []; S.seen ||= {}; tab = "chats";
  refreshMe(); renderList(); if (!S.profile.done) openProfile();
  $("main").innerHTML = '<div class="empty">🌸<br>Pick a chat to start talking!</div>';
});
</script>
</body></html>
